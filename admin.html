<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Auntor Chakma Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 100px auto;
            padding: 2rem;
        }
        .admin-card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .admin-card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-color);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .save-btn {
            background: var(--primary-color);
            color: white;
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .save-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        .login-container {
            max-width: 400px;
            margin: 150px auto;
            padding: 2rem;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="loginSection" class="login-container">
        <div class="admin-card">
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <div id="loginError" class="alert alert-error" style="display: none;">Incorrect password</div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <button class="save-btn" onclick="login()">Login</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-container" style="display: none;">
        <button class="logout-btn" onclick="logout()">Logout</button>
        <h1 style="margin-bottom: 2rem;">Portfolio Admin Panel</h1>
        <div id="successMessage" class="alert alert-success" style="display: none;">Changes saved successfully!</div>

        <!-- CV Link -->
        <div class="admin-card">
            <h2><i class="fas fa-file-pdf"></i> CV Download Link</h2>
            <div class="form-group">
                <label>CV PDF URL</label>
                <input type="text" id="cvLink" placeholder="https://example.com/cv.pdf">
            </div>
            <button class="save-btn" onclick="saveCV()">Save CV Link</button>
        </div>

        <!-- Profile Picture -->
        <div class="admin-card">
            <h2><i class="fas fa-image"></i> Profile Picture</h2>
            <div class="form-group">
                <label>Profile Picture URL</label>
                <input type="text" id="profilePic" placeholder="https://example.com/profile.jpg">
            </div>
            <button class="save-btn" onclick="saveProfilePic()">Save Profile Picture</button>
        </div>

        <!-- Publications -->
        <div class="admin-card">
            <h2><i class="fas fa-book"></i> Publications Links</h2>
            
            <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Publication 1: Bangla License Plate</h3>
            <div class="form-group">
                <label>PDF URL</label>
                <input type="text" id="pub1Pdf" placeholder="https://example.com/paper.pdf">
            </div>
            <div class="form-group">
                <label>Publisher Link</label>
                <input type="text" id="pub1Link" placeholder="https://link.springer.com/...">
            </div>

            <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Publication 2: Diabetic Retinopathy</h3>
            <div class="form-group">
                <label>PDF URL</label>
                <input type="text" id="pub2Pdf" placeholder="https://example.com/paper.pdf">
            </div>
            <div class="form-group">
                <label>Link URL</label>
                <input type="text" id="pub2Link" placeholder="https://...">
            </div>

            <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Publication 3: IoMT Intrusion Detection</h3>
            <div class="form-group">
                <label>PDF URL</label>
                <input type="text" id="pub3Pdf" placeholder="https://example.com/paper.pdf">
            </div>
            <div class="form-group">
                <label>Link URL</label>
                <input type="text" id="pub3Link" placeholder="https://...">
            </div>

            <button class="save-btn" onclick="savePublications()">Save All Publications</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
